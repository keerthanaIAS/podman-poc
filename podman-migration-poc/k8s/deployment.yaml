apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-root-ms
  namespace: cube-poc
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cube-root-ms

  template:
    metadata:
      labels:
        app: cube-root-ms

    spec:
      containers:
        - name: cube-root-ms

          image: cube-root-ms:poc

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3001

          env:
            - name: NODE_ENV
              value: "poc"

            - name: CONTAINER_ENGINE
              value: "podman"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: transaction-storage
              mountPath: /data

            - name: application-logs
              mountPath: /logs

      volumes:
        - name: transaction-storage
          persistentVolumeClaim:
            claimName: cube-transaction-pvc

        - name: application-logs
          emptyDir: {}